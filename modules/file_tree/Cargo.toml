# ============================================================================
# modules/file_tree/Cargo.toml — Module File Tree
#
# Hub de navigation et d'indexation sémantique. Dépend du core (le trait
# Module) et de rien d'autre côté Engram_Hive. Supprimer ce dossier +
# retirer "file_tree" de modules.ron = le module disparaît proprement.
# ============================================================================

[package]
name = "file_tree"
version = "0.1.0"
edition = "2021"

[dependencies]
engram_core = { path = "../../core" }
egui = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
ron = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
tempfile = "3"
