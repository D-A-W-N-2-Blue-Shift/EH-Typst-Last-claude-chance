# ============================================================================
# modules/sticky_notes/Cargo.toml — Module Sticky Notes
#
# Post-its d'écrivain ancrés dans les fichiers, avec stockage SQLite dans la
# base existante du projet. Module autonome, chargé par app/src/main.rs.
# ============================================================================

[package]
name = "sticky_notes"
version = "0.1.0"
edition = "2021"

[dependencies]
engram_core = { path = "../../core" }
egui = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
