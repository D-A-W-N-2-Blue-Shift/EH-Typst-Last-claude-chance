# ============================================================================
# core/Cargo.toml — Le noyau d'Engram_Hive
#
# Ne dépend d'AUCUN module. Le core ne connaît les modules que via le
# trait Module et le registre de factories rempli par le binaire.
# ============================================================================

[package]
name = "engram_core"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
