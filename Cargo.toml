# ============================================================================
# Cargo.toml — Racine du workspace Hive_RBMK_Tcherenkov
#
# Ce dépôt ne construit QUE l'application Hive (suivi santé/organisation) :
#   - core/                 : le noyau partagé (trait Module, bus, registre)
#   - nexus_db/             : la couche de données SQLite (nexus.db)
#   - modules/nexus_hub, health, journal, todo, dashboard, articles,
#     cockpit_nexus         : les modules Hive
#   - app_nexus/            : le binaire Hive_RBMK_Tcherenkov (GUI eframe)
#
# L'application écrivain Engram_Hive vit AILLEURS (dépôt beta séparé). Ses
# anciens crates (app/, modules/editor, file_tree, cockpit, sticky_notes,
# timeline, claude_terminal) restent sur le disque à titre d'archive mais
# sont EXCLUS du workspace : plus compilés, plus testés, plus aucun binaire
# engram_hive généré. `cargo build`/`cargo run` ne produisent plus qu'un
# seul binaire : Hive_RBMK_Tcherenkov.
#
# Les versions des dépendances partagées sont centralisées ici.
# ============================================================================

[workspace]
resolver = "2"
members = [
    "core",
    "nexus_db",
    "modules/nexus_hub",
    "modules/health",
    "modules/journal",
    "modules/todo",
    "modules/dashboard",
    "modules/articles",
    "modules/cockpit_nexus",
    "app_nexus",
]
exclude = [
    "app",
    "modules/file_tree",
    "modules/editor",
    "modules/cockpit",
    "modules/sticky_notes",
    "modules/timeline",
    "modules/claude_terminal",
]

[workspace.dependencies]
egui = "0.31"
# Cible Fedora : Wayland natif + X11. Le build nécessite wayland-devel
# (Fedora) / libwayland-dev (Debian) installé sur la machine de build.
# default-features = false pour éliminer accesskit (tire quick-xml 0.30 via
# zbus/atspi). On réactive explicitement ce qu'on utilise.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts", "glow", "wayland", "x11", "persistence",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"
serde_json = "1"
chrono = "0.4"
# --- Icône / fond : décodage PNG uniquement, pas de lib C. ---
image = { version = "0.25", default-features = false, features = ["png"] }
# --- Backup WrapDrive (core) : archives tar.gz, pur Rust. ---
tar = "0.4"
flate2 = "1"
thiserror = "1"
# --- Entrées conservées pour les crates écrivain archivés (exclus) ---
# Aucun membre actif du workspace ne les utilise : elles ne tirent RIEN
# dans Cargo.lock ni dans le binaire Hive. Conservées uniquement pour que
# les manifestes archivés (app/, modules/editor, …) redeviennent
# résolvables tels quels si l'exclusion est un jour annulée.
serde_yaml = "0.9"
regex = "1"
toml = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ropey = "1.6"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rayon = "1.10"

# ============================================================================
# cargo audit — les advisories volontairement ignorées et leurs justifications
# techniques sont dans .cargo/audit.toml (config officielle cargo-audit).
# Toute nouvelle advisory DOIT être traitée, pas ajoutée à cette liste sans
# analyse documentée.
# ============================================================================
